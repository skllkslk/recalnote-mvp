services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recallnote}
      POSTGRES_USER: ${POSTGRES_USER:-recallnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recallnote} -d ${POSTGRES_DB:-recallnote}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  agent-api:
    build:
      context: ./agent
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODE: ${AGENT_MODE:-mock}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  core-api:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-recallnote}
      DB_USER: ${DB_USER:-recallnote}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://agent-api:8000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      DEV_USER_ID: ${DEV_USER_ID:-dev-user-001}
      DEV_USER_ENABLED: ${DEV_USER_ENABLED:-true}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
