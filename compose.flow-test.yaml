# Isolated mock integration environment; never uses the application database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flow_test
      POSTGRES_USER: flow_test
      POSTGRES_PASSWORD: flow-test-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_test -d flow_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  agent-api:
    build: ./agent
    environment:
      INTERNAL_API_KEY: flow-test-internal-key
      AGENT_MODE: mock
  core-api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DEV_USER_ENABLED: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flow_test
      DB_USER: flow_test
      DB_PASSWORD: flow-test-only-password
      AGENT_BASE_URL: http://agent-api:8000
      INTERNAL_API_KEY: flow-test-internal-key
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      agent-api:
        condition: service_started
