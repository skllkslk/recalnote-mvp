server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recallnote}
    username: ${DB_USER:recallnote}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:}
app:
  dev-user-enabled: ${DEV_USER_ENABLED:false}
  dev-user-id: ${DEV_USER_ID:dev-user-001}
